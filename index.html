  <script>
    function stat(sites) {
      const parsedSites = stat._parseSites(sites);
      if (parsedSites.indexOf('1000171913') > -1) {
        parsedSites.push('1253039837');
      }
      parsedSites.forEach((site) => {
        const script = stat._createScript(site);
        document.head.appendChild(script);
      });
    }

    stat._parseSites = function (sites = []) {
      sites = [].concat(sites);
      if (stat.commonIncluded) {
        sites.unshift('common');
      }
      const parse = (site) => stat.sites[site] || site;
      const unique = (arr) => {
        const newArr = [];
        for (let i = 0; i < arr.length; i++) {
          const item = arr[i];
          if (newArr.indexOf(item) === -1) {
            newArr.push(item);
          }
        }
        return newArr;
      };
      return unique(sites.map(parse));
    };

    stat._createScript = function (id) {
      const script = document.createElement('script');
      const protocol = location.protocol;
      const args = [];
      args.push(`id=${id}`);
      args.push(`web_id=${id}`);
      args.push('async=1');
      script.charset = 'utf-8';
      script.type = 'text/javascript';
      script.async = true;
      script.src = `${protocol}//s96.cnzz.com/z_stat.php?${args.join('&')}`;
      return script;
    };

    stat.commonIncluded = true;
    stat.sites = {
      common: '1000171913',
      vip: '1255889801',
      diary: '1262999091',
      hero: '1262999091',
      news: '1254618299',
      video: '1253231394',
      calendar: '1253656910',
      datacenter: '1261933372',
    };

    let cnzzStatInitialized = false;

    function initCnzzStat() {
      if (cnzzStatInitialized) return;
      cnzzStatInitialized = true;
      try {
        stat();
      } catch (error) {
        console.warn('cnzzStat 初始化失败', error);
      }
    }
  </script>

    function buildStats(events) {
      const riseCount = events.filter(e => e.event_type === '涨停').length;
      const fallCount = events.filter(e => e.event_type === '跌停').length;
      const productCounter = events.reduce((acc, item) => {
        item.products_list.forEach(product => {
          acc[product] = (acc[product] || 0) + 1;
        });
        return acc;
      }, {});
      const sectorCounter = countBy(events, 'sector_name');
      const topProduct = Object.entries(productCounter).sort((a,b) => b[1]-a[1])[0] || ['--', 0];
      const topSector = Object.entries(sectorCounter).sort((a,b) => b[1]-a[1])[0] || ['--', 0];
      return { riseCount, fallCount, topProduct, topSector };
    }

    function countBy(arr, key) {
      return arr.reduce((acc, item) => {
        const k = item[key];
        acc[k] = (acc[k] || 0) + 1;
        return acc;
      }, {});
    }

    function uniqueValues(arr, key) {
      return [...new Set(arr.map(item => item[key]))];
    }

    function uniqueProducts(arr) {
      return [...new Set(arr.flatMap(item => item.products_list))];
    }

      const el = document.getElementById(containerId);
      el.innerHTML = '';
      values.forEach(value => {
        const chip = document.createElement('button');
        chip.className = 'chip' + (value === active ? ' active' : '');
        chip.textContent = value;
        chip.onclick = () => onClick(value);
        el.appendChild(chip);
      });
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
      const chars = String(text || '').split('');
      let line = '';
      let lines = [];
      chars.forEach(char => {
        const testLine = line + char;
        if (ctx.measureText(testLine).width > maxWidth && line) {
          lines.push(line);
          line = char;
        } else {
          line = testLine;
        }
      });
      if (line) lines.push(line);
      if (maxLines && lines.length > maxLines) {
        lines = lines.slice(0, maxLines);
        while (ctx.measureText(lines[lines.length - 1] + '...').width > maxWidth && lines[lines.length - 1].length > 1) {
          lines[lines.length - 1] = lines[lines.length - 1].slice(0, -1);
        }
        lines[lines.length - 1] += '...';
      }
      lines.forEach((lineText, index) => ctx.fillText(lineText, x, y + index * lineHeight));
      return y + lines.length * lineHeight;
    }

      const match = String(tradeDate || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

      const [, year, month, day] = match;
      return `${year}年${Number(month)}月${Number(day)}日更新`;
    }

    async function copyPageUrl(url) {
      if (navigator.clipboard?.writeText && window.isSecureContext) {
        await navigator.clipboard.writeText(url);
        return true;
      }

      const textarea = document.createElement('textarea');
      textarea.value = url;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.top = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (error) {
        copied = false;
      }

      document.body.removeChild(textarea);
      return copied;
    }

    function buildReasonRadar(item) {
      const escapeSvgText = (text) => String(text || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
      const keywords = [
        item.tags[0] || item.event_level,
        item.tags[1] || item.close_status,
        item.tags[2] || item.sector_name,
        item.tags[3] || item.products_list[0]
      ];
      const axes = [
        { label: '核心催化', keyword: keywords[0], value: Math.min(96, 58 + Math.round(item.core_driver.length / 8)) },
        { label: '辅助因素', keyword: keywords[1], value: Math.min(94, 50 + Math.round(item.secondary_driver.length / 10) + item.tags.length * 3) },
        { label: '背景因素', keyword: keywords[2], value: Math.min(92, 48 + Math.round(item.background_driver.length / 11) + Math.min(item.products_list.length, 8) * 3) },
        { label: '待验证', keyword: keywords[3], value: Math.min(90, 45 + Math.round(item.pending_factor.length / 12) + item.consecutive_limit_count * 6) }
      ];
      const cx = 150;
      const cy = 108;
      const maxR = 56;
      const color = item.event_type === '涨停' ? '#d14a3a' : '#1f9d55';
      const fill = item.event_type === '涨停' ? 'rgba(209,74,58,0.16)' : 'rgba(31,157,85,0.16)';

      const pointFor = (value, idx, radius = maxR) => {
        const angle = -Math.PI / 2 + idx * (Math.PI * 2 / axes.length);
        const r = radius * (value / 100);
        return {
          x: cx + Math.cos(angle) * r,
          y: cy + Math.sin(angle) * r
        };
      };
      const polygon = axes.map((axis, idx) => {
        const p = pointFor(axis.value, idx);
        return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
      }).join(' ');
      const rings = [0.35, 0.7, 1].map(level => {
        const points = axes.map((_, idx) => {
          const p = pointFor(100, idx, maxR * level);
          return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
        }).join(' ');
        return `<polygon points="${points}" fill="none" stroke="#e8dfd3" stroke-width="1"></polygon>`;
      }).join('');
      const spokes = axes.map((_, idx) => {
        const p = pointFor(100, idx);
        return `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#e8dfd3" stroke-width="1"></line>`;
      }).join('');
      const labels = axes.map((axis, idx) => {
        const p = pointFor(138, idx);
        const anchor = idx === 1 ? 'start' : idx === 3 ? 'end' : 'middle';
        const keywordDy = idx === 0 ? -12 : idx === 2 ? 10 : -2;
        const axisDy = keywordDy + 14;
        return `
          <text class="radar-keyword" x="${p.x.toFixed(1)}" y="${(p.y + keywordDy).toFixed(1)}" text-anchor="${anchor}">${escapeSvgText(axis.keyword)}</text>
          <text class="radar-axis" x="${p.x.toFixed(1)}" y="${(p.y + axisDy).toFixed(1)}" text-anchor="${anchor}">${axis.label}</text>
        `;
      }).join('');

      return `
        <div class="radar-panel">
          <svg class="radar-chart" viewBox="0 0 300 232" role="img" aria-label="原因拆解雷达图">
            ${rings}
            ${spokes}
            <polygon points="${polygon}" fill="${fill}" stroke="${color}" stroke-width="2.2"></polygon>
            ${axes.map((axis, idx) => {
              const p = pointFor(axis.value, idx);
              return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" fill="${color}"></circle>`;
            }).join('')}
            ${labels}
          </svg>
        </div>
      `;
    }

        const rect = tag.getBoundingClientRect();
        const tagX = rect.left + rect.width / 2;
        tag.style.left = tagX < clientWidth / 2 ? '10px' : (clientWidth - rect.width - 10) + 'px';
        if (rect.top < 0) tag.style.top = '10px';
        if (rect.bottom > clientHeight) tag.style.top = (clientHeight - rect.height - 10) + 'px';
      };

      const onDragStart = (event) => {
        isDragging = true;
        isMoved = false;
        tag.classList.add('dragging');
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const clientY = event.touches ? event.touches[0].clientY : event.clientY;
        const rect = tag.getBoundingClientRect();
        startX = clientX;
        startY = clientY;
        initialLeft = rect.left;
        initialTop = rect.top;
      };

      const onDragMove = (event) => {
        if (!isDragging) return;
        if (event.cancelable) event.preventDefault();
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const clientY = event.touches ? event.touches[0].clientY : event.clientY;
        const dx = clientX - startX;
        const dy = clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isMoved = true;
        tag.style.left = (initialLeft + dx) + 'px';
        tag.style.top = (initialTop + dy) + 'px';
      };

      const onDragEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        tag.classList.remove('dragging');
        snapToEdge();
      };

      window.addEventListener('resize', () => {
        clientWidth = document.documentElement.clientWidth;
        clientHeight = document.documentElement.clientHeight;
        if (!isDragging) snapToEdge();
      });
      tag.addEventListener('mousedown', onDragStart);
      tag.addEventListener('touchstart', onDragStart, { passive: false });
      document.addEventListener('mousemove', onDragMove, { passive: false });
      document.addEventListener('touchmove', onDragMove, { passive: false });
      document.addEventListener('mouseup', onDragEnd);
      document.addEventListener('touchend', onDragEnd);
      tag.addEventListener('click', () => {
        if (isMoved) return;
        if (window.eruda) {
          eruda.show();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/eruda';
        script.onload = function () {
          eruda.init();
          eruda.show();
        };
        document.body.appendChild(script);
      });
    }

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });
    document.getElementById('posterModal').addEventListener('click', (e) => {
      if (e.target.id === 'posterModal') closePosterModal();
    });
    document.getElementById('posterCloseBtn').addEventListener('click', closePosterModal);

    async function init() {
      await fetchExtremeEvents();
      renderStats();
      initFilters();
      initTimelineSearch();
      renderEvents();
      renderTimeline();
      initAppEnvironment();
      initCnzzStat();
      initTestEnvTag();
    }

    init();

    document.addEventListener('DOMContentLoaded', function() {
      const externalLinks = document.querySelectorAll('a[href^="http"]');
      externalLinks.forEach((link) => {
        if (link.id !== 'download-btn') {
          link.addEventListener('click', handleArticleLink);
        }
      });
    });
  </script>
</body>
</html>
